# Au démarrage, Nginx résout "app" vers les 3 copies
# et répartit les requêtes à tour de rôle (round-robin)
upstream app_servers {
    server app:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://app_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
